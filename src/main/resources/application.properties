spring.application.name=claricejoias-ws

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/claricejoias}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:claricejoias}



spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


api.url.front=http://localhost:3000,https://www.claricejoiasoficial.com.br,https://claricejoiasoficial.com.br


spring.batch.jdbc.initialize-schema=always


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8083/realms/claricejoias
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8083/realms/claricejoias/protocol/openid-connect/certs


keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8083}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}


app.whatsapp.cooldown-horas=24
# Base pública onde este backend é acessível pela Evolution API (para buscar imagens de /api/arquivos/view/*)
app.public.url=${APP_PUBLIC_URL:http://localhost:8080}
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8081}
evolution.api.key=${EVOLUTION_API_KEY:claricejoias}
evolution.api.instance=${EVOLUTION_API_INSTANCE:rev_karolbarcelar_67722}



spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin}