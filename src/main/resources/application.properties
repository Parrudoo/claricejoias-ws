spring.application.name=claricejoias-ws



spring.datasource.url=jdbc:postgresql://localhost:5432/claricejoias
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=claricejoias


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

api.url.front=http://localhost:3000


# Inicializa as tabelas internas do Spring Batch
spring.batch.jdbc.initialize-schema=always


# O link deve apontar para o realm que você criou
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8083/realms/claricejoias
# Isso ajuda o Spring a baixar as chaves públicas para validar a assinatura do JWT automaticamente
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8083/realms/claricejoias/protocol/openid-connect/certs


app.whatsapp.cooldown-horas=24