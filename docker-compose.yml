services:
  app:
    build: .
    ports:
      - "8082:8080"
    environment:
      - SPRING_APPLICATION_NAME=claricejoias-ws
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=claricejoias
    depends_on:
      - minio
      - db
      - keycloak

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: claricejoias
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  evolution-api:
    image: atendai/evolution-api:v1.8.2
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=claricejoias # Sua senha atualizada
    volumes:
      - evolution_instances:/evolution/instances

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/claricejoias
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
    ports:
      - "8083:8080" # Porta 8083 escolhida para não conflitar com a API ou Evolution
    depends_on:
      - db
    volumes:
      - ./meu-tema-keycloak/clarice-joias:/opt/keycloak/themes/clarice-joias

volumes:
  db_data:
  evolution_instances: